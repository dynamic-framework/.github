name: PR Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        description: 'Path to the labeler configuration file'
        required: false
        type: string
        default: 'workflows/.github/labeler.yml'

jobs:
  pr-labeler:
    permissions:
        contents: read
        pull-requests: write
        issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dynamic-framework/.github repository
        uses: actions/checkout@v6
        with:
          repository: dynamic-framework/.github
          ref: feat/own-workflows-actions
          path: workflows
          sparse-checkout: |
            .github
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List folders and files
        run: |
          ls
      
      - name: Verify files
        run: |
          ls -R workflows/.github

      - name: Labeler
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ inputs.configuration-path }}